<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>无人机设备基础 - 抢答对决系统</title>
  
  <!-- ========================================= -->
  <!-- 1. 本地离线库 (推荐，便于课堂离线使用和开源复现) -->

  <script src="./tailwind.js"></script>
  <script src="./react.js"></script>
  <script src="./react-dom.js"></script>
  <script src="./babel.js"></script>

  <!-- ========================================= -->
  <!-- 2. 国内 CDN (仅在不携带本地库文件时备用) -->

  <!-- 
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.staticfile.net/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    /* 全局样式 */
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); /* Slate 900 to Indigo 950 */
      color: #f1f5f9;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Boss Mode Background */
    body.boss-mode {
      background: linear-gradient(135deg, #2a0a0a 0%, #000000 100%);
    }
    
    /* 玻璃拟态面板 */
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .boss-panel {
      background: rgba(40, 10, 10, 0.8) !important;
      border: 1px solid rgba(255, 50, 50, 0.3) !important;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.2) !important;
    }

    /* 动画关键帧 */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(234, 179, 8, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    
    @keyframes countdown-pop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes slide-in-up {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes flash-green {
      0% { background-color: rgba(34, 197, 94, 0.8); transform: scale(1.1); }
      100% { background-color: transparent; transform: scale(1); }
    }
    
    @keyframes pop-in {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes slam {
       0% { transform: scale(3); opacity: 0; letter-spacing: 20px; }
       100% { transform: scale(1); opacity: 1; letter-spacing: 0px; }
    }
    
    @keyframes stripes-move { from { background-position: 0 0; } to { background-position: 60px 60px; } }
    @keyframes elastic-slide-right { from { transform: translateX(-150%) skewX(20deg); opacity: 0; } to { transform: translateX(0) skewX(0); opacity: 1; } }
    @keyframes elastic-slide-left { from { transform: translateX(150%) skewX(-20deg); opacity: 0; } to { transform: translateX(0) skewX(0); opacity: 1; } }
    @keyframes slam-impact { 
       0% { transform: scale(3) rotate(-15deg); opacity: 0; filter: blur(10px); } 
       70% { transform: scale(0.9) rotate(5deg); opacity: 1; filter: blur(0); }
       85% { transform: scale(1.1) rotate(-3deg); }
       100% { transform: scale(1) rotate(0); opacity: 1; } 
    }
    @keyframes lightning-strike {
       0% { opacity: 0; transform: translateY(-80px) scaleY(1.5) scaleX(0.5); }
       20% { opacity: 1; transform: translateY(0) scaleY(1) scaleX(1); filter: brightness(2); }
       40% { opacity: 0.5; filter: brightness(1); }
       60% { opacity: 1; filter: brightness(1.5); }
       100% { opacity: 0; transform: scale(1.2); }
    }
    @keyframes shockwave {
       0% { transform: scale(0); opacity: 0.6; border-width: 60px; }
       100% { transform: scale(2); opacity: 0; border-width: 0; }
    }
    @keyframes flash {
       0%, 100% { opacity: 0.1; }
       5% { opacity: 0.3; }
       10% { opacity: 0.1; }
    }

    /* Chain Animation */
    @keyframes chain-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-5px, 5px) rotate(-1deg); }
      75% { transform: translate(5px, -5px) rotate(1deg); }
    }
    @keyframes chain-break-left {
      0% { transform: translateX(0) rotate(45deg); opacity: 1; }
      100% { transform: translateX(-100vw) rotate(0deg); opacity: 0; }
    }
    @keyframes chain-break-right {
      0% { transform: translateX(0) rotate(-45deg); opacity: 1; }
      100% { transform: translateX(100vw) rotate(0deg); opacity: 0; }
    }
    @keyframes screen-shatter {
      0% { transform: scale(1); filter: hue-rotate(0deg); }
      50% { transform: scale(1.05) translate(2px, -2px); filter: hue-rotate(90deg) contrast(200%); }
      100% { transform: scale(1); filter: hue-rotate(0deg); }
    }

    /* 火焰特效动画 */
    @keyframes burn-orange {
      0% { box-shadow: 0 0 10px #fbbf24, 0 0 20px #d97706, 0 -10px 40px #b45309; }
      50% { box-shadow: 0 0 15px #fcd34d, 0 0 30px #f59e0b, 0 -15px 50px #d97706; transform: scale(1.02); }
      100% { box-shadow: 0 0 10px #fbbf24, 0 0 20px #d97706, 0 -10px 40px #b45309; }
    }

    @keyframes burn-red {
      0% { box-shadow: 0 0 15px #fca5a5, 0 0 30px #ef4444, 0 -20px 60px #b91c1c; }
      50% { box-shadow: 0 0 20px #fecaca, 0 0 40px #f87171, 0 -25px 70px #dc2626; transform: scale(1.03); }
      100% { box-shadow: 0 0 15px #fca5a5, 0 0 30px #ef4444, 0 -20px 60px #b91c1c; }
    }

    @keyframes burn-blue {
      0% { box-shadow: 0 0 20px #a5f3fc, 0 0 40px #06b6d4, 0 -30px 80px #1d4ed8; filter: hue-rotate(0deg); }
      50% { box-shadow: 0 0 30px #cffafe, 0 0 60px #22d3ee, 0 -40px 100px #2563eb; transform: scale(1.05); filter: hue-rotate(15deg); }
      100% { box-shadow: 0 0 20px #a5f3fc, 0 0 40px #06b6d4, 0 -30px 80px #1d4ed8; filter: hue-rotate(0deg); }
    }

    @keyframes burn-purple {
      0% { box-shadow: 0 0 20px #e9d5ff, 0 0 40px #a855f7, 0 -30px 80px #7e22ce; filter: hue-rotate(0deg); }
      50% { box-shadow: 0 0 30px #f3e8ff, 0 0 60px #c084fc, 0 -40px 100px #9333ea; transform: scale(1.05); filter: hue-rotate(15deg); }
      100% { box-shadow: 0 0 20px #e9d5ff, 0 0 40px #a855f7, 0 -30px 80px #7e22ce; filter: hue-rotate(0deg); }
    }

    .fire-lv1 { animation: burn-orange 2s infinite ease-in-out; border-color: #f59e0b !important; }
    .fire-lv2 { animation: burn-red 1.5s infinite ease-in-out; border-color: #ef4444 !important; }
    .fire-lv3 { animation: burn-blue 1s infinite ease-in-out; border-color: #3b82f6 !important; }
    .fire-lv4 { animation: burn-purple 0.8s infinite ease-in-out; border-color: #a855f7 !important; }

    /* 抢答按钮特效 */
    .buzzer-btn {
      transition: all 0.1s;
      position: relative;
      overflow: hidden;
    }
    .buzzer-btn:active { transform: scale(0.95); }
    .buzzer-btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.3s, transform 0.3s;
    }
    .buzzer-btn:active::after { opacity: 1; transform: scale(1); }

    /* 选项样式 */
    .option-card {
      transition: all 0.2s;
    }
    .option-card:hover { background: rgba(255,255,255,0.1); }
    .option-card.selected-correct { background: #059669 !important; border-color: #34d399 !important; }
    .option-card.selected-wrong { background: #b91c1c !important; border-color: #f87171 !important; }
    
    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

    /* 抽签动画样式 */
    .slot-rolling {
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
    .slot-set {
      animation: flash-green 0.5s ease-out;
    }
    
    /* 排行榜前三名浮动动画 */
    .rank-1 { animation: float 3s ease-in-out infinite; }
    .rank-2 { animation: float 4s ease-in-out infinite 0.5s; }
    .rank-3 { animation: float 5s ease-in-out infinite 1s; }
    
    /* 剩余学号池网格动画 */
    .pool-grid-item { transition: all 0.3s; }
    .pool-grid-item-exit { transform: scale(0); opacity: 0; }
    
    /* Glitch Text Effect for Boss */
    .glitch {
      position: relative;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .glitch::before {
      left: 2px;
      text-shadow: -1px 0 red;
      clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }
    .glitch::after {
      left: -2px;
      text-shadow: -1px 0 blue;
      clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }
    @keyframes glitch-anim-1 {
      0% { clip: rect(20px, 9999px, 10px, 0); }
      100% { clip: rect(80px, 9999px, 100px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(100px, 9999px, 20px, 0); }
      100% { clip: rect(10px, 9999px, 80px, 0); }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect, useMemo } = React;

    // ==========================================
    // 配置：资源路径 (本地化准备)
    // ==========================================
    // 隐藏BOSS头像路径：请在本地建立assets文件夹，放入 donk.jpg
    const BOSS_IMG_SRC = "./assets/donk.jpg"; 
    // 备用在线BOSS头像 (Donk Team Spirit)
    const BOSS_IMG_FALLBACK = "https://img.redbull.com/images/c_limit,w_1500,h_1000,f_auto,q_auto/redbullcom/2024/2/12/c4f1g8u6k4j5x8z3q2w1/team-spirit-donk";

    // 隐藏BOSS音乐路径：请在本地建立assets文件夹，放入 boss_music.mp3
    const BOSS_AUDIO_SRC = "./assets/boss_music.mp3";
    // 备用在线Phonk音乐 (Aggressive Drift Phonk)
    const BOSS_AUDIO_FALLBACK = "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/KieLoKaz/Free_Ganxta_Phonk_Tracks/KieLoKaz_-_01_-_Reunion_of_the_Ghosts_ID_359.mp3";

    // ==========================================
    // 1. 图标与组件
    // ==========================================
    const Icons = {
      Trophy: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
      Zap: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
      Users: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      RotateCcw: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
      Swords: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/></svg>,
      Clock: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      Dice: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/></svg>,
      Crown: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>,
      LogOut: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
      Medal: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="17" r="5"/><path d="M12 17v-5"/><path d="M9 2 9 7"/><path d="M15 2 15 7"/><path d="M15 7 12 11 9 7"/></svg>,
      ArrowRight: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>,
      Trash: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
      Music: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
      MusicOff: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3.15a4 4 0 1 1-2.38-1.55"/><path d="M9 5l7-1.17V9"/><path d="M23 18a4 4 0 0 1-4 4"/></svg>,
      Skip: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" y1="5" x2="19" y2="19" /></svg>,
      Flame: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.3a9 9 0 0 0 4 6.5a1 1 0 0 0 .5-3.2"/></svg>,
      ChevronDown: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
      Lock: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    };

    // 卡通头像组件 (支持根据ID自动配色，Boss模式下可替换为图片)
    const CartoonAvatar = ({ rank, id, size = "w-16 h-16", className="", isBoss = false }) => {
      const getColors = () => {
        if (rank === 1) return ["#FCD34D", "#F59E0B"]; // 金
        if (rank === 2) return ["#E2E8F0", "#94A3B8"]; // 银
        if (rank === 3) return ["#FDBA74", "#C2410C"]; // 铜
        
        if (!id) return ["#475569", "#1e293b"]; // 默认深灰
        
        const hash = String(id).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
        const palettes = [
          ["#fca5a5", "#b91c1c"], // 红
          ["#fdba74", "#c2410c"], // 橙
          ["#fde047", "#a16207"], // 黄
          ["#86efac", "#15803d"], // 绿
          ["#67e8f9", "#0e7490"], // 青
          ["#93c5fd", "#1d4ed8"], // 蓝
          ["#c4b5fd", "#7c3aed"], // 紫
          ["#f9a8d4", "#be185d"], // 粉
        ];
        return palettes[hash % palettes.length];
      };

      const colors = getColors();

      if (isBoss) {
        return (
           <div className={`${size} ${className} rounded-full overflow-hidden border-4 border-red-600 shadow-[0_0_30px_red] relative bg-black transition-all group`}>
             <img src={BOSS_IMG_SRC} onError={(e) => e.target.src = BOSS_IMG_FALLBACK} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="BOSS" />
             <div className="absolute inset-0 bg-red-900/20 mix-blend-overlay animate-pulse"></div>
           </div>
        );
      }

      return (
        <div className={`${size} ${className} rounded-full overflow-hidden border-2 shadow-sm flex items-center justify-center relative bg-white transition-all`} style={{ borderColor: colors[1] }}>
           <svg viewBox="0 0 100 100" className="w-full h-full">
             <path d="M20 90 Q50 100 80 90 L80 100 L20 100 Z" fill={colors[1]} />
             <circle cx="50" cy="50" r="35" fill="#FFE4C4" />
             <circle cx="40" cy="45" r="4" fill="#333" />
             <circle cx="60" cy="45" r="4" fill="#333" />
             <path d="M40 60 Q50 70 60 60" stroke="#333" strokeWidth="3" fill="none" />
             {(rank === 1) && <path d="M30 30 L40 10 L50 30 L60 10 L70 30 Z" fill="#FBBF24" stroke="#B45309" strokeWidth="2"/>}
           </svg>
           {rank <= 3 && rank > 0 && (
             <div className="absolute -bottom-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center text-white font-bold text-xs border border-white shadow-sm" style={{backgroundColor: colors[1]}}>
               {rank}
             </div>
           )}
        </div>
      );
    };

    // ==========================================
    // 2. 题库数据

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="relative flex-1" ref={containerRef}>
          <button 
            onClick={() => setIsOpen(!isOpen)}
            className={`w-full text-left bg-slate-800 border border-slate-600 rounded-lg p-3 text-white flex justify-between items-center transition-all ${colorClass} ${isOpen ? 'ring-2' : ''}`}

                 <Icons.Dice className="w-5 h-5 inline mr-2"/> 随机生成
               </button>
               <button 
                 onClick={handleStart}
                 className="flex-[2] py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl font-bold shadow-lg shadow-indigo-900/20"
               >
                 开始对决
               </button>
             </div>
           </div>
         </div>
       );
    };

    // ==========================================
    // 6. 组件：排行榜
    // ==========================================
    const Leaderboard = ({ stats, onBack, currentClass, onClassChange, onClearStats }) => {
      const [showClearConfirm, setShowClearConfirm] = useState(false);
      
      const sortedStats = Object.entries(stats)
        .sort(([, winsA], [, winsB]) => winsB - winsA)
        .slice(0, 10); // Top 10

      const handleClear = () => {
        onClearStats();
        setShowClearConfirm(false);
      };

      return (
        <div className="min-h-screen p-4 flex flex-col items-center justify-center">
          {/* 清空确认弹窗 */}
          {showClearConfirm && (
             <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-[fade-in_0.2s]">
                <div className="glass-panel p-6 rounded-2xl w-full max-w-sm text-center border border-red-500/30">
                   <div className="w-14 h-14 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto mb-4">
                      <Icons.Trash className="w-8 h-8"/>
                   </div>
                   <h3 className="text-xl font-bold text-white mb-2">确定清空记录?</h3>
                   <p className="text-slate-400 mb-6">您将删除 <span className="text-yellow-400 font-bold">{currentClass}班</span> 的所有胜率数据，此操作不可恢复。</p>
                   <div className="flex gap-3">
                      <button onClick={() => setShowClearConfirm(false)} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg">取消</button>
                      <button onClick={handleClear} className="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold">确认清空</button>
                   </div>
                </div>
             </div>
          )}

          <div className="glass-panel w-full max-w-4xl rounded-3xl p-8 relative max-h-[90vh] overflow-hidden flex flex-col">
            <button onClick={onBack} className="absolute top-6 left-6 p-2 bg-slate-800 rounded-full hover:bg-slate-700 transition-colors z-10">
              <Icons.RotateCcw className="w-6 h-6 text-slate-300" />
            </button>
            
            {/* 班级切换Tabs */}
            <div className="absolute top-6 right-6 flex bg-slate-800 rounded-full p-1 border border-slate-700 z-10">
              <button 
                onClick={() => onClassChange(1)}
                className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all ${currentClass === 1 ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                1班
              </button>
              <button 
                onClick={() => onClassChange(2)}
                className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all ${currentClass === 2 ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                2班
              </button>
            </div>
            
            <div className="text-center mb-8 pt-4">
              <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 inline-flex items-center gap-3">
                <Icons.Crown className="w-10 h-10 text-yellow-500" /> {currentClass}班 英雄榜
              </h2>
              <p className="text-indigo-200 mt-2">荣耀属于最强的大脑</p>
            </div>

            {/* Top 3 Podium */}
            <div className="flex justify-center items-end gap-4 md:gap-8 mb-12 min-h-[200px]">
              {/* 2nd Place */}
              {sortedStats[1] && (
                <div className="flex flex-col items-center rank-2">
                  <CartoonAvatar rank={2} id={sortedStats[1][0]} />
                  <div className="mt-2 text-xl font-bold text-slate-300">{sortedStats[1][0]}号</div>
                  <div className="bg-slate-400 w-20 md:w-24 h-24 rounded-t-lg flex items-center justify-center text-slate-800 font-black text-2xl shadow-lg relative">
                     <div className="text-xs absolute bottom-2">银牌</div>
                     {sortedStats[1][1]}胜
                  </div>
                </div>
              )}
              
              {/* 1st Place */}
              {sortedStats[0] && (
                <div className="flex flex-col items-center rank-1 z-10 -mx-2">
                   <div className="relative">
                      <Icons.Crown className="absolute -top-8 left-1/2 -translate-x-1/2 w-10 h-10 text-yellow-400 animate-bounce" />
                      <CartoonAvatar rank={1} id={sortedStats[0][0]} size="w-24 h-24" />
                   </div>
                  <div className="mt-2 text-2xl font-bold text-yellow-300">{sortedStats[0][0]}号</div>
                  <div className="bg-yellow-400 w-24 md:w-32 h-32 rounded-t-lg flex items-center justify-center text-yellow-900 font-black text-4xl shadow-xl shadow-yellow-500/20 relative">
                     <div className="text-sm absolute bottom-4 font-bold">冠军</div>
                     {sortedStats[0][1]}胜
                  </div>
                </div>
              )}

              {/* 3rd Place */}
              {sortedStats[2] && (
                <div className="flex flex-col items-center rank-3">
                  <CartoonAvatar rank={3} id={sortedStats[2][0]} />
                  <div className="mt-2 text-xl font-bold text-orange-300">{sortedStats[2][0]}号</div>
                  <div className="bg-orange-400 w-20 md:w-24 h-16 rounded-t-lg flex items-center justify-center text-orange-900 font-black text-2xl shadow-lg relative">
                     <div className="text-xs absolute bottom-2">铜牌</div>
                     {sortedStats[2][1]}胜
                  </div>
                </div>
              )}
            </div>

            {/* List for others */}
            <div className="flex-1 overflow-y-auto pr-2 space-y-3">
              {sortedStats.slice(3).map(([id, wins], idx) => (
                <div key={id} className="flex items-center justify-between p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                  <div className="flex items-center gap-4">
                    <span className="text-slate-500 font-mono w-6">#{idx + 4}</span>
                    <CartoonAvatar id={id} size="w-10 h-10" />
                    <span className="font-bold text-lg">{id} 号同学</span>
                  </div>
                  <div className="font-mono text-indigo-300 font-bold">{wins} 胜</div>
                </div>
              ))}
              {sortedStats.length === 0 && <div className="text-center text-slate-500 py-8">暂无数据，快去对决吧！</div>}
            </div>
            
            {/* 底部清空按钮 */}
            {sortedStats.length > 0 && (
              <div className="mt-4 pt-4 border-t border-slate-700 flex justify-center">
                 <button 
                   onClick={() => setShowClearConfirm(true)}
                   className="flex items-center gap-2 text-slate-500 hover:text-red-400 transition-colors text-sm px-4 py-2 rounded-lg hover:bg-slate-800/50"
                 >
                    <Icons.Trash className="w-4 h-4" /> 清空本班记录
                 </button>
              </div>
            )}

          </div>
        </div>
      );
    };

    // ==========================================
    // 7. 组件：抢答对决核心逻辑 (BattleArena)
    // ==========================================
    const BattleArena = ({ p1, p2, onWinner, onBack, onMatchEnd, mode, isBossMode = false }) => {
      const [phase, setPhase] = useState('ready'); 
      const [question, setQuestion] = useState(null);
      const [scores, setScores] = useState({ p1: 0, p2: 0 });
      const [buzzedPlayer, setBuzzedPlayer] = useState(null); 
      const [timer, setTimer] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null); 
      const [roundWinner, setRoundWinner] = useState(null);
      const [matchResult, setMatchResult] = useState(null); 
      const [showExitDialog, setShowExitDialog] = useState(false);
      
      const audioRef = useRef(null);
      const [isMuted, setIsMuted] = useState(false);
      const [trackIndex, setTrackIndex] = useState(0);

      // 修改分数逻辑：Boss模式10分，其他模式(包括King)均为5分
      const WIN_SCORE = isBossMode ? 10 : 5; 
      const questionBankRef = useRef(shuffleArray([...RAW_QUESTIONS]));
      const qIndexRef = useRef(0);

      // BGM Setup
      useEffect(() => {
         const audio = new Audio(isBossMode ? BOSS_AUDIO_SRC : BGM_PLAYLIST[0]); 
         audio.volume = 0.3;
         audioRef.current = audio;

         // 如果是Boss模式，尝试使用备用链接失败处理
         if (isBossMode) {
            audio.onerror = () => {
                console.log("Local Boss Audio not found, using fallback.");
                audio.src = BOSS_AUDIO_FALLBACK;
            }
         }

         const handleEnded = () => {
             if (!isBossMode) setTrackIndex(prev => (prev + 1) % BGM_PLAYLIST.length);
             else { audio.currentTime = 0; audio.play(); } // Loop boss music
         };
         
         const handleError = () => {
             console.log("Audio Error, skipping...");
             if (!isBossMode) setTrackIndex(prev => (prev + 1) % BGM_PLAYLIST.length);
         };

         audio.addEventListener('ended', handleEnded);
         audio.addEventListener('error', handleError);

         return () => {
            if(audioRef.current) {
               audioRef.current.pause();
               audioRef.current.removeEventListener('ended', handleEnded);
               audioRef.current.removeEventListener('error', handleError);
               audioRef.current = null;
            }
         }
      }, [isBossMode]);

      useEffect(() => {
         if(!audioRef.current) return;
         
         // Only switch tracks if NOT in boss mode (Boss mode sticks to one track)
         if (!isBossMode) {
             audioRef.current.pause();
             audioRef.current.src = BGM_PLAYLIST[trackIndex];
             audioRef.current.load();
         }

         if (!isMuted && (phase === 'ready' || phase === 'fight')) {
             const playPromise = audioRef.current.play();
             if (playPromise !== undefined) {
                 playPromise.catch(error => console.log("Auto-play prevented"));
             }
         }
      }, [trackIndex, isBossMode]);

      useEffect(() => {
         if(!audioRef.current) return;
         if (isMuted) {
             audioRef.current.pause();
             return;
         }
         if (phase === 'ready' || phase === 'fight') {
             const playPromise = audioRef.current.play();
             if (playPromise !== undefined) playPromise.catch(console.log);
         } else {
             audioRef.current.pause();
         } 
      }, [phase, isMuted]);

      const nextRound = () => {
        if (qIndexRef.current >= questionBankRef.current.length) {
          qIndexRef.current = 0;
          questionBankRef.current = shuffleArray([...RAW_QUESTIONS]);
        }
        const q = questionBankRef.current[qIndexRef.current];
        qIndexRef.current++;
        
        setQuestion(q);
        setBuzzedPlayer(null);
        setSelectedOption(null);
        setRoundWinner(null);
        startReadyCountdown();
      };

      useEffect(() => { nextRound(); }, []);

      useEffect(() => {
        let interval;
        if (timer > 0) {
          interval = setInterval(() => setTimer(t => t - 1), 1000);
        } else if (timer === 0) {
          if (phase === 'ready') setPhase('fight');
          else if (phase === 'answering') handleWrongAnswer(true); 
        }
        return () => clearInterval(interval);
      }, [timer, phase]);

      const startReadyCountdown = () => {
        setPhase('ready');
        setTimer(3);
      };

      const handleBuzz = (player) => {
        if (phase !== 'fight') return;
        setBuzzedPlayer(player);
        setPhase('answering');
        setTimer(5); 
      };

      const handleOptionClick = (optionLetter) => {
        if (phase !== 'answering') return;
        setSelectedOption(optionLetter);
        
        const safeOption = String(optionLetter).trim().toUpperCase();
        const safeAnswer = String(question.answer).trim().toUpperCase();
        const isCorrect = safeOption === safeAnswer;
        
        if (isCorrect) {
          const newScores = { ...scores, [buzzedPlayer]: scores[buzzedPlayer] + 1 };
          setScores(newScores);
          setRoundWinner(buzzedPlayer);
          finalizeRound(newScores);
        } else {
          const opponent = buzzedPlayer === 'p1' ? 'p2' : 'p1';
          const newScores = { ...scores, [opponent]: scores[opponent] + 1 };
          setScores(newScores);
          setRoundWinner(opponent); 
          finalizeRound(newScores);
        }
      };

      const handleWrongAnswer = (isTimeout) => {
        const opponent = buzzedPlayer === 'p1' ? 'p2' : 'p1';
        const newScores = { ...scores, [opponent]: scores[opponent] + 1 };
        setScores(newScores);
        setRoundWinner(opponent);
        setSelectedOption(isTimeout ? 'TIMEOUT' : null);
        finalizeRound(newScores);
      };

      const finalizeRound = (currentScores) => {
        setPhase('result');
        setTimer(0);
        
        if (currentScores.p1 >= WIN_SCORE || currentScores.p2 >= WIN_SCORE) {
          setTimeout(() => {
            const winner = currentScores.p1 >= WIN_SCORE ? p1 : p2;
            setMatchResult({ winner }); 
          }, 2000);
        }
      };
      
      const handleVictoryConfirm = () => {
        if (!matchResult) return;
        const winner = matchResult.winner;
        if (onMatchEnd) onMatchEnd(winner); 
        if (onWinner) onWinner(winner);     
        onBack();                           
      };

      const renderOption = (opt) => {
        let className = `option-card w-full p-4 md:p-5 rounded-xl border text-left text-xl md:text-2xl font-bold mb-4 flex items-center transition-all ${isBossMode ? 'border-red-900 bg-red-950/40' : 'border-slate-600 bg-slate-800/50'} `;
        if (phase === 'answering') className += "hover:bg-indigo-900/50 cursor-pointer border-indigo-500/50 text-indigo-100";
        else if (phase === 'result') {
          const safeOpt = String(opt.letter).trim().toUpperCase();
          const safeAnswer = String(question.answer).trim().toUpperCase();
          
          if (safeOpt === safeAnswer) className += "selected-correct text-white shadow-lg shadow-green-900/50 scale-105 z-10"; 
          else if (opt.letter === selectedOption) className += "selected-wrong text-white opacity-50"; 
          else className += "opacity-30 grayscale";
        } else if (phase === 'fight') className += "opacity-80"; 

        return (
          <button key={opt.letter} onClick={() => handleOptionClick(opt.letter)} disabled={phase !== 'answering'} className={className}>
            <span className={`inline-flex items-center justify-center w-10 h-10 rounded-full mr-6 text-lg font-black shrink-0 ${phase === 'result' && String(opt.letter).trim().toUpperCase() === String(question.answer).trim().toUpperCase() ? 'bg-white text-green-600' : 'bg-slate-700 text-slate-300'}`}>{opt.letter}</span>
            <span className="leading-snug">{opt.text}</span>
          </button>
        );
      };

      if (matchResult) {
        return (
          <div className="flex flex-col items-center justify-center h-screen animate-[fade-in_0.5s] relative z-50">
            <div className={`text-center p-12 glass-panel rounded-3xl border relative ${isBossMode ? 'boss-panel' : 'border-yellow-500/30'}`}>
               <div className="animate-bounce mb-6 inline-block text-yellow-400"><Icons.Trophy className="w-24 h-24" /></div>
               <div className="text-2xl text-yellow-200 uppercase tracking-widest mb-4">WINNER</div>
               <div className="text-8xl font-black bg-clip-text text-transparent bg-gradient-to-b from-yellow-200 to-yellow-600 mb-8">{matchResult.winner} 号</div>
               <button onClick={handleVictoryConfirm} className="px-10 py-4 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-500 hover:to-teal-500 text-white rounded-full font-bold text-xl shadow-lg transition-all transform hover:scale-105">结束本局 &rarr;</button>
            </div>
          </div>
        );
      }

      const ExitDialog = () => (
        <div className="absolute inset-0 z-[100] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center animate-[fade-in_0.2s]">
          <div className="bg-slate-800 p-8 rounded-2xl border border-slate-600 shadow-2xl max-w-sm w-full text-center">
             <div className="mb-6">
               <div className="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                 <Icons.LogOut className="w-8 h-8"/>
               </div>
               <h3 className="text-xl font-bold text-white mb-2">确定退出?</h3>
               <p className="text-slate-400">当前的比赛进度将会丢失，无法恢复。</p>
             </div>
             <div className="flex gap-4">
               <button onClick={() => setShowExitDialog(false)} className="flex-1 py-3 bg-slate-700 text-slate-200 rounded-xl hover:bg-slate-600 font-medium">取消</button>
               <button onClick={onBack} className="flex-1 py-3 bg-red-600 text-white rounded-xl hover:bg-red-500 font-bold">退出</button>
             </div>
          </div>
        </div>
      );
      
      const panelClass = isBossMode ? "flex-1 glass-panel rounded-3xl p-8 flex flex-col relative overflow-y-auto pb-4 boss-panel" : "flex-1 glass-panel rounded-3xl p-8 flex flex-col relative overflow-y-auto pb-4";

      return (
        <div className={`h-screen flex flex-col p-4 max-w-6xl mx-auto overflow-hidden relative ${isBossMode ? 'text-red-100' : ''}`}>
          {showExitDialog && <ExitDialog />}

          <div className={`flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-800 mb-4 shrink-0 ${isBossMode ? 'border-red-900 bg-black/80' : ''}`}>
            <div className="flex items-center gap-4 w-1/3">
              <div className="w-12 h-12 rounded-xl flex items-center justify-center font-black text-xl shadow-lg border relative overflow-hidden">
                  {isBossMode && p1 ? <img src={BOSS_IMG_SRC} onError={(e)=>e.target.src=BOSS_IMG_FALLBACK} className="w-full h-full object-cover"/> : <div className="bg-indigo-600 w-full h-full flex items-center justify-center">{p1}</div>}
              </div>
              <div className="flex-1">
                <div className={`text-xs font-bold mb-1 ${isBossMode ? 'text-red-500 glitch' : 'text-indigo-300'}`} data-text={isBossMode ? "BOSS" : ""}>选手 1 {mode === 'king' && "(擂主)"}</div>
                <div className="h-3 w-full bg-slate-800 rounded-full overflow-hidden"><div className={`h-full transition-all duration-500 ${isBossMode ? 'bg-red-600' : 'bg-indigo-500'}`} style={{width: `${(scores.p1/WIN_SCORE)*100}%`}}></div></div>
              </div>
              <div className={`text-3xl font-black ${isBossMode ? 'text-red-500' : 'text-indigo-400'}`}>{scores.p1}</div>
            </div>

            <div className="text-center w-1/3 flex flex-col items-center">
              {phase === 'answering' ? <div className="text-4xl font-black text-yellow-400 animate-pulse flex items-center gap-2"><Icons.Clock className="w-8 h-8" /> {timer}s</div> : <div className="text-slate-500 font-mono text-sm tracking-widest">TARGET: {WIN_SCORE} PTS</div>}
            </div>

            <div className="flex items-center gap-4 w-1/3 flex-row-reverse text-right">
              <div className="w-12 h-12 bg-pink-600 rounded-xl flex items-center justify-center font-black text-xl shadow-lg shadow-pink-900/50 border border-pink-400">{p2}</div>
              <div className="flex-1">
                <div className="text-xs text-pink-300 font-bold mb-1">选手 2 {mode === 'king' && "(挑战者)"}</div>
                <div className="h-3 w-full bg-slate-800 rounded-full overflow-hidden flex justify-end"><div className="h-full bg-pink-500 transition-all duration-500" style={{width: `${(scores.p2/WIN_SCORE)*100}%`}}></div></div>
              </div>
              <div className="text-3xl font-black text-pink-400">{scores.p2}</div>
            </div>
          </div>

          <div className="flex-1 flex gap-6 min-h-0 relative">
            {phase === 'ready' && <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm rounded-3xl animate-[fade-in_0.3s]"><div className="text-[12rem] font-black text-yellow-400 drop-shadow-[0_0_50px_rgba(234,179,8,0.8)] animate-[countdown-pop_1s_infinite]">{timer}</div><div className="absolute bottom-20 text-2xl text-white font-bold tracking-widest uppercase">Ready to Buzz</div></div>}

            <button className={`buzzer-btn w-32 md:w-48 rounded-3xl flex flex-col items-center justify-center gap-4 transition-all duration-300 ${phase === 'fight' ? 'bg-indigo-600 hover:bg-indigo-500 shadow-[0_0_30px_rgba(79,70,229,0.4)] cursor-pointer translate-y-0' : 'bg-slate-800 text-slate-600 cursor-not-allowed grayscale opacity-50'} ${buzzedPlayer === 'p1' ? '!bg-yellow-500 !text-black !opacity-100 !grayscale-0 ring-4 ring-yellow-300 shadow-[0_0_50px_rgba(234,179,8,0.6)] scale-105 z-10' : ''} ${isBossMode && phase === 'fight' ? '!bg-red-800 !hover:bg-red-700' : ''}`} onClick={() => handleBuzz('p1')} disabled={phase !== 'fight'}>
              <div className="p-4 rounded-full bg-white/20"><Icons.Zap className="w-12 h-12" /></div><span className="text-xl font-bold">抢答!</span><span className="text-xs opacity-60">P1 按钮</span>
            </button>

            {/* 核心答题区域 */}
            <div className={panelClass}>
              <div className="flex justify-between items-start mb-6"><span className="px-3 py-1 bg-slate-700 rounded text-xs text-slate-300">单选题</span><span className="text-slate-500 text-sm">ID: {question?.id}</span></div>
              <h2 className="text-2xl md:text-3xl font-bold leading-normal mb-8 text-white">{question?.question}</h2>
              <div className="space-y-2 w-full max-w-2xl mx-auto flex-1">{question?.options.map(opt => renderOption(opt))}</div>
              
              {/* 结果覆盖层 */}
              {phase === 'result' && (
                <div className="absolute inset-0 z-20 flex flex-col items-center justify-center animate-[fade-in_0.2s] pointer-events-none">
                   <div className="absolute inset-0 bg-black/20 pointer-events-auto"></div>
                   <div className="relative z-30 pointer-events-auto text-center transform scale-110">
                     <div className={`text-6xl mb-4 flex items-center justify-center w-24 h-24 mx-auto rounded-full border-4 shadow-2xl ${roundWinner === buzzedPlayer ? 'text-green-400 border-green-500 bg-slate-900' : 'text-red-400 border-red-500 bg-slate-900'}`}>
                       {roundWinner === buzzedPlayer ? '✓' : '✕'}
                     </div>
                     <button onClick={nextRound} className="px-12 py-5 bg-yellow-500 hover:bg-yellow-400 text-yellow-950 rounded-full font-black text-2xl shadow-[0_0_30px_rgba(234,179,8,0.6)] hover:scale-105 active:scale-95 transition-all flex items-center gap-3 border-4 border-yellow-300">
                       下一题 <Icons.ArrowRight className="w-8 h-8"/>
                     </button>
                   </div>
                </div>
              )}
              
              <div className="mt-8 pt-6 border-t border-slate-700/50 flex justify-center shrink-0">
                 <button onClick={() => setShowExitDialog(true)} className="text-slate-500 hover:text-red-400 text-sm flex items-center gap-2 px-4 py-2 rounded hover:bg-slate-800 transition-colors">
                    <Icons.LogOut className="w-4 h-4" /> 退出对决
                 </button>
              </div>
            </div>

              <div className="p-4 rounded-full bg-white/20"><Icons.Zap className="w-12 h-12" /></div><span className="text-xl font-bold">抢答!</span><span className="text-xs opacity-60">P2 按钮</span>

    };

    // ==========================================
    // 8. 组件：数字滚动组件
    // ==========================================
    const SlotMachineNumber = ({ value, isRolling }) => {
      const [displayValue, setDisplayValue] = useState(value || "??");
      useEffect(() => {
        let interval;
        if (isRolling) {
          interval = setInterval(() => {
            const randomId = Math.floor(Math.random() * 54) + 1;
            setDisplayValue(randomId < 10 ? `0${randomId}` : `${randomId}`);
          }, 50);
        } else setDisplayValue(value || "?");
        return () => clearInterval(interval);
      }, [isRolling, value]);
      return <span className={`${isRolling ? 'slot-rolling' : value ? 'slot-set' : 'text-slate-500'}`}>{displayValue}</span>;
    };

    // ==========================================
    // 8.5 组件：对决前介绍动画 (MatchIntro) - 修复布局版
    // ==========================================

           {/* 1. 动态背景 (Moving Stripes) */}

              {/* Shockwave circle on VS impact */}
              <div className="absolute w-[80vh] h-[80vh] rounded-full border-[40px] border-yellow-500/10 scale-0 animate-[shockwave_0.8s_ease-out_1.2s_forwards]"></div>
           </div>

           {/* 3. 布局重构：使用绝对定位确保VS在最高层 */}
           <div className="relative z-10 w-full max-w-7xl h-full flex items-center justify-center px-4">
              
              {/* Avatars Container (Grid) - Z-Index 10 - Fixed 2-column center alignment for max separation */}
              <div className="w-full grid grid-cols-2 items-center z-10 pointer-events-none">
                  
                  {/* P1 (Left) - Centered in Left Half */}
                  <div className="flex justify-center items-center transform translate-x-[-150%] opacity-0 animate-[elastic-slide-right_1s_cubic-bezier(0.34,1.56,0.64,1)_0.2s_forwards]">
                     <div className="relative group pointer-events-auto">
                        <div className={`absolute -inset-8 bg-gradient-to-r rounded-full blur-2xl opacity-40 group-hover:opacity-80 transition duration-500 animate-pulse ${isBoss ? 'from-red-600 to-orange-600' : 'from-indigo-600 to-blue-600'}`}></div>
                        <div className={`relative w-24 h-24 md:w-64 md:h-64 bg-slate-900 border-4 rounded-full flex items-center justify-center overflow-hidden shadow-[0_0_50px_rgba(99,102,241,0.5)] ${isBoss ? 'border-red-500 shadow-[0_0_50px_red]' : 'border-indigo-500'}`}>
                            <CartoonAvatar id={p1} size="w-full h-full" isBoss={isBoss} />
                            {/* 名字遮罩 */}
                            <div className={`absolute bottom-0 w-full backdrop-blur-md py-3 text-center border-t ${isBoss ? 'bg-red-950/80 border-red-400/50' : 'bg-indigo-950/80 border-indigo-400/50'}`}>
                               <span className={`text-lg md:text-3xl font-black text-white tracking-widest drop-shadow-md font-mono ${isBoss ? 'glitch' : ''}`} data-text={p1}>{p1}</span>
                            </div>
                        </div>
                        {/* 装饰性角标 */}
                        <div className={`absolute -top-6 -left-6 text-white text-sm md:text-lg font-bold px-4 md:px-6 py-2 rounded-full border-4 border-slate-950 uppercase tracking-wider shadow-lg transform -rotate-12 z-20 flex flex-col items-center whitespace-nowrap ${isBoss ? 'bg-red-700' : 'bg-indigo-600'}`}>
                           {p1Label}
                        </div>
                        {/* 连胜记录 */}
                        {p1Subtext && (
                           <div className="absolute -bottom-6 -right-6 bg-yellow-500 text-yellow-950 text-base md:text-xl font-black px-5 py-2 rounded-full border-4 border-slate-950 shadow-[0_0_20px_rgba(234,179,8,0.8)] transform rotate-6 z-20 animate-bounce flex items-center gap-2 whitespace-nowrap">
