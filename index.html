                  <div className="flex justify-center items-center transform translate-x-[150%] opacity-0 animate-[elastic-slide-left_1s_cubic-bezier(0.34,1.56,0.64,1)_0.6s_forwards]">
                     <div className="relative group pointer-events-auto">
                        <div className="absolute -inset-8 bg-gradient-to-r from-pink-600 to-rose-600 rounded-full blur-2xl opacity-40 group-hover:opacity-80 transition duration-500 animate-pulse"></div>
                        <div className="relative w-24 h-24 md:w-64 md:h-64 bg-slate-900 border-4 border-pink-500 rounded-full flex items-center justify-center overflow-hidden shadow-[0_0_50px_rgba(236,72,153,0.5)]">
                            <CartoonAvatar id={p2} size="w-full h-full" />
                             <div className="absolute bottom-0 w-full bg-pink-950/80 backdrop-blur-md py-3 text-center border-t border-pink-400/50">
                               <span className="text-lg md:text-3xl font-black text-white tracking-widest drop-shadow-md font-mono">{p2}</span>
                            </div>
                        </div>
                        <div className="absolute -top-6 -right-6 bg-pink-600 text-white text-sm md:text-lg font-bold px-4 md:px-6 py-2 rounded-full border-4 border-slate-950 uppercase tracking-wider shadow-lg transform rotate-12 z-20 whitespace-nowrap">
                           {p2Label}
                        </div>
                     </div>
                  </div>
              </div>

              {/* VS (Center) - Absolute Positioning, Z-Index 50 */}
              <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center pointer-events-none">
                  {/* Lightning SVG */}
                  <div className="absolute -top-12 md:-top-32 opacity-0 animate-[lightning-strike_0.4s_ease-out_1s_forwards] text-yellow-400 z-0">
                     <Icons.Zap className="w-32 h-32 md:w-64 md:h-64 drop-shadow-[0_0_50px_rgba(234,179,8,1)] filter brightness-150" />
                  </div>
                  
                  {/* Text */}
                  <div className="relative z-10 text-5xl md:text-9xl lg:text-[10rem] leading-none font-black italic text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-orange-500 to-red-600 drop-shadow-[0_10px_20px_rgba(0,0,0,1)] transform scale-0 animate-[slam-impact_0.6s_cubic-bezier(0.175,0.885,0.32,1.275)_1.1s_forwards] whitespace-nowrap" style={{fontFamily: 'Impact, sans-serif', textShadow: '0 0 30px rgba(234,179,8,0.4), 4px 4px 0px rgba(0,0,0,0.5)'}}>
                    VS
                  </div>
              </div>

           </div>
           
           {/* Footer Text */}
           <div className="absolute bottom-12 md:bottom-20 text-center animate-[fade-in_1s_ease-out_2s_backwards]">
              <div className="text-xl md:text-2xl text-slate-400 font-mono tracking-[0.5em] uppercase mb-4 text-shadow-sm">Battle Starting</div>
              <div className="flex justify-center gap-3">
                 {[...Array(5)].map((_,i) => (
                    <div key={i} className="w-3 h-3 md:w-4 md:h-4 bg-yellow-500 rounded-full animate-bounce shadow-[0_0_10px_rgba(234,179,8,0.8)]" style={{animationDelay: `${i*0.1}s`, animationDuration: '0.8s'}}></div>
                 ))}
              </div>
           </div>
        </div>
      );
    };
    
    // ==========================================
    // 8.6 组件：隐藏BOSS解锁动画 (BossEntryAnimation)
    // ==========================================
    const BossEntryAnimation = ({ onComplete }) => {
      const [stage, setStage] = useState(0); // 0: Chains, 1: Break, 2: Shatter
      const audioRef = useRef(new Audio(BOSS_AUDIO_SRC)); // Preload boss music

      useEffect(() => {
        // Fallback music if local not found
        audioRef.current.onerror = () => { audioRef.current.src = BOSS_AUDIO_FALLBACK; };
        audioRef.current.volume = 0.5;
        audioRef.current.play().catch(e => console.log("Auto play prevented"));

        const t1 = setTimeout(() => setStage(1), 2000); // Break chains
        const t2 = setTimeout(() => setStage(2), 2500); // Shatter screen
        const t3 = setTimeout(onComplete, 4000); // Finish

        return () => {
          clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
        }
      }, [onComplete]);

      return (
        <div className="fixed inset-0 z-[200] bg-black flex items-center justify-center overflow-hidden">
           {/* Chains */}
           <div className={`absolute inset-0 transition-opacity duration-500 ${stage >= 2 ? 'opacity-0' : 'opacity-100'}`}>
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120vw] h-24 bg-zinc-800 border-y-4 border-zinc-600 flex items-center justify-center shadow-2xl transform -rotate-45 origin-center" style={{animation: stage === 0 ? 'chain-shake 0.1s infinite' : 'chain-break-left 0.5s forwards'}}>
                 <div className="text-zinc-500 font-mono tracking-[50px] opacity-30">LOCKED LOCKED LOCKED</div>
                 <Icons.Lock className="w-16 h-16 text-zinc-400 absolute" />
              </div>
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120vw] h-24 bg-zinc-800 border-y-4 border-zinc-600 flex items-center justify-center shadow-2xl transform rotate-45 origin-center" style={{animation: stage === 0 ? 'chain-shake 0.1s infinite reverse' : 'chain-break-right 0.5s forwards'}}>
                 <div className="text-zinc-500 font-mono tracking-[50px] opacity-30">LOCKED LOCKED LOCKED</div>
                 <Icons.Lock className="w-16 h-16 text-zinc-400 absolute" />
              </div>
           </div>
           
           {/* Flash & Message */}
           {stage >= 1 && (
             <div className="absolute inset-0 bg-white animate-[flash_0.2s_ease-out_forwards]" style={{animationName: 'flash-green'}}></div>
           )}
           
           {stage >= 2 && (
             <div className="relative z-10 text-center animate-[pop-in_0.5s] text-red-600" style={{animation: 'screen-shatter 0.2s'}}>
                <div className="text-9xl font-black glitch" data-text="UNLOCKED">UNLOCKED</div>
                <div className="text-4xl text-white font-bold mt-4 tracking-widest uppercase">Secret Boss Challenge</div>
             </div>
           )}
        </div>
      );
    };

    // ==========================================
    // 7.5 组件：擂台赛模式逻辑 (KingGame)
    // ==========================================
    const KingGame = ({ students, onBack, onMatchEnd }) => {
       const [king, setKing] = useState(null);
       const [challenger, setChallenger] = useState(null);
       const [streak, setStreak] = useState(0); // 连胜数
       const [streakRecords, setStreakRecords] = useState([]); // 本局连胜榜
       const [phase, setPhase] = useState('setup'); // setup, lobby, intro, battle, defended, conquered, boss_entry
       
       // Boss Mode State derived from streak
       const isBossMode = streak >= 12;

       useEffect(() => {
         if (isBossMode) document.body.classList.add('boss-mode');
         else document.body.classList.remove('boss-mode');
         return () => document.body.classList.remove('boss-mode');
       }, [isBossMode]);

       const getFireClass = (count) => {
         if (isBossMode) return "fire-lv2 shadow-[0_0_60px_rgba(220,38,38,0.9)] border-4 border-red-600 scale-105"; // Boss uses intense red
         if (count >= 8) return "fire-lv4 shadow-[0_0_60px_rgba(168,85,247,0.8)] border-4"; // Purple (New)
         if (count >= 5) return "fire-lv3 shadow-[0_0_40px_rgba(59,130,246,0.6)] border-4"; // Blue
         if (count >= 3) return "fire-lv2 shadow-[0_0_30px_rgba(239,68,68,0.6)] border-4"; // Red
         if (count >= 1) return "fire-lv1 shadow-[0_0_20px_rgba(245,158,11,0.5)] border-2"; // Orange
         return "border-slate-500 border-2";
       };

       const handleStartBattle = () => {
         if (king && challenger && king !== challenger) {
            setPhase('intro'); // 先进介绍动画
         } else {
            alert("请确保双方选手已就位且不相同！");
         }
       };

       const handleBattleOver = (winnerId) => {
          onMatchEnd(winnerId); // 记录总胜场 (英雄榜)
          
          if (winnerId === king) {
             const newStreak = streak + 1;
             setStreak(newStreak);
             setChallenger(null);
             
             // Check for Boss Unlock
             if (newStreak === 12) {
                setPhase('boss_entry');
             } else {
                setPhase('defended');
             }
          } else {
             const newRecord = { id: king, streak: streak };
             setStreakRecords(prev => [...prev, newRecord].sort((a,b) => b.streak - a.streak).slice(0, 5));
             
             setKing(winnerId);
             setStreak(1);
             setChallenger(null);
             setPhase('conquered');
          }
       };

       const pickRandomChallenger = () => {
          const others = students.filter(s => s !== king);
          const r = others[Math.floor(Math.random() * others.length)];
          setChallenger(r);
       };

       useEffect(() => {
          if (phase === 'defended' || phase === 'conquered') {
             const timer = setTimeout(() => {
                setPhase('lobby');
             }, 3000);
             return () => clearTimeout(timer);
          }
       }, [phase]);

       if (phase === 'setup') {
          return (
             <div className="flex flex-col items-center justify-center min-h-screen p-4 animate-[fade-in_0.5s]">
                <div className="glass-panel p-8 rounded-2xl w-full max-w-md text-center">
                   <button onClick={onBack} className="absolute top-4 left-4 text-slate-400 hover:text-white"><Icons.RotateCcw className="w-6 h-6"/></button>
                   <Icons.Crown className="w-16 h-16 text-yellow-500 mx-auto mb-4" />
                   <h2 className="text-2xl font-bold text-white mb-6">谁是第一任擂主?</h2>
                   <div className="mb-6 text-left relative z-20">
                      <CustomSelect 
                          value={king}
                          onChange={setKing}
                          options={students}
                          placeholder="选择初始擂主..."
                          colorClass="focus:ring-yellow-500 hover:border-yellow-500"
                      />
                   </div>
                   <button 
                      onClick={() => king && setPhase('lobby')}
                      disabled={!king}
                      className="w-full py-3 bg-yellow-600 hover:bg-yellow-500 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl font-bold"
                   >
                      登上擂台
                   </button>
                </div>
             </div>
          );
       }
       
       if (phase === 'boss_entry') {
         return <BossEntryAnimation onComplete={() => setPhase('defended')} />;
       }

       if (phase === 'intro') {
           return (
             <MatchIntro 
                p1={king} 
                p2={challenger} 
                p1Label={isBossMode ? "💀 隐藏BOSS" : "👑 现任擂主"}
                p2Label="⚔️ 挑战者"
                p1Subtext={streak > 0 ? `${streak} 连胜中!` : null}
                onStart={() => setPhase('battle')} 
                isBoss={isBossMode}
             />
           );
       }

       if (phase === 'battle') {
          return (
             <BattleArena 
                p1={king} 
                p2={challenger} 
                onWinner={handleBattleOver}
                onMatchEnd={() => {}} 
                onBack={() => setPhase('lobby')}
                mode="king"
                isBossMode={isBossMode}
             />
          );
       }
       
       if (phase === 'defended') {
          return (
             <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur">
                <div className="text-center animate-[pop-in_0.5s]">
                   <div className={`text-6xl font-black mb-4 flex items-center justify-center gap-4 ${isBossMode ? 'text-red-500' : 'text-yellow-400'}`}>
                      <Icons.Crown className="w-16 h-16" /> {isBossMode ? "BOSS 守擂!" : "守擂成功!"}
                   </div>
                   <div className={`w-40 h-40 mx-auto rounded-full border-4 overflow-hidden relative mb-4 shadow-[0_0_50px_rgba(234,179,8,0.5)] ${isBossMode ? 'border-red-600' : 'border-yellow-500'}`}>
                      <CartoonAvatar id={king} size="w-full h-full" isBoss={isBossMode} />
                   </div>
                   <div className="text-3xl text-white font-bold">连胜场次: {streak}</div>
                </div>
             </div>
          );
       }

       if (phase === 'conquered') {
          return (
             <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur">
                <div className="text-center animate-[slam_0.5s]">
                   <div className="text-red-500 text-6xl font-black mb-4 flex items-center justify-center gap-4">
                      <Icons.Swords className="w-16 h-16" /> 攻擂成功!
                   </div>
                   <div className="w-40 h-40 mx-auto rounded-full border-4 border-red-500 overflow-hidden relative mb-4 shadow-[0_0_50px_rgba(239,68,68,0.5)]">
                      <CartoonAvatar id={king} size="w-full h-full" />
                   </div>
                   <div className="text-2xl text-slate-300">新擂主诞生</div>
                </div>
             </div>
          );
       }

       return (
          <div className="min-h-screen p-4 flex flex-col relative overflow-hidden transition-colors duration-1000">
             <button onClick={onBack} className="absolute top-4 left-4 z-20 flex items-center gap-2 text-slate-400 hover:text-white px-3 py-1 rounded-lg bg-slate-800/50 hover:bg-slate-700 transition-all border border-slate-700"><Icons.RotateCcw className="w-5 h-5" /> 退出擂台</button>
             
             <div className="text-center mt-2 mb-8 z-10">
                <h2 className={`text-4xl font-black text-transparent bg-clip-text inline-flex items-center gap-3 ${isBossMode ? 'bg-gradient-to-r from-red-600 to-black text-red-500 glitch' : 'bg-gradient-to-r from-red-500 via-orange-500 to-yellow-500'}`} data-text={isBossMode ? "BOSS CHALLENGE" : ""}>
                   <Icons.Flame className={`w-10 h-10 animate-pulse ${isBossMode ? 'text-red-600' : 'text-orange-500'}`} /> {isBossMode ? "隐藏 BOSS 挑战" : "擂台连胜挑战"}
                </h2>
             </div>

             <div className="flex-1 flex flex-col md:flex-row gap-6 max-w-6xl mx-auto w-full z-10">
                <div className={`flex-1 rounded-2xl p-8 flex flex-col items-center justify-center relative border-t-4 transition-all duration-500 ${isBossMode ? 'boss-panel border-red-600' : 'glass-panel border-yellow-500'}`}>
                   <div className={`absolute top-4 left-0 w-full text-center font-bold tracking-widest uppercase text-sm ${isBossMode ? 'text-red-500 glitch' : 'text-yellow-500'}`} data-text={isBossMode ? "FINAL BOSS" : ""}>{isBossMode ? "FINAL BOSS" : "Current King"}</div>
                   <div className={`relative w-48 h-48 rounded-full mb-6 transition-all duration-500 ${getFireClass(streak)}`}>
                      <CartoonAvatar id={king} size="w-full h-full" isBoss={isBossMode} />
                   </div>
                   <div className="text-5xl font-black text-white mb-2">{king} <span className="text-2xl text-slate-400">号</span></div>
                   <div className={`flex items-center gap-2 text-2xl font-bold px-4 py-2 rounded-full border ${isBossMode ? 'text-red-500 bg-black border-red-600' : 'text-yellow-400 bg-yellow-900/30 border-yellow-600/50'}`}>
                      <Icons.Flame className="w-6 h-6" /> {streak} 连胜
                   </div>
                </div>

                <div className="w-full md:w-64 flex flex-col justify-center items-center gap-6">
                   <div className={`text-6xl font-black italic ${isBossMode ? 'text-red-600' : 'text-slate-700'}`}>VS</div>
                   {challenger ? (
                      <button 
                         onClick={handleStartBattle}
                         className={`w-full py-4 bg-gradient-to-r text-white rounded-xl font-bold text-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] transition-all animate-pulse hover:scale-105 active:scale-95 ${isBossMode ? 'from-black to-red-900 border border-red-500' : 'from-red-600 to-pink-600'}`}
                      >
                         {isBossMode ? "挑战 BOSS" : "开始对决"}
                      </button>
                   ) : (
                      <div className="w-full space-y-3 relative z-30">
                         <button onClick={pickRandomChallenger} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 border border-slate-600">
                            <Icons.Dice className="w-5 h-5" /> 随机挑战者
                         </button>
                         <div className="w-full text-left relative z-20">
                            <CustomSelect 
                                value={challenger}
                                onChange={setChallenger}
                                options={students.filter(s => s !== king)}
                                placeholder="指定挑战者..."
                                colorClass="bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-500"
                            />
                         </div>
                      </div>
                   )}
                </div>

                <div className="flex-1 glass-panel rounded-2xl p-8 flex flex-col items-center justify-center relative border-t-4 border-slate-500">
                   <div className="absolute top-4 left-0 w-full text-center text-slate-400 font-bold tracking-widest uppercase text-sm">Challenger</div>
                   <div className="w-40 h-40 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center mb-6 overflow-hidden shadow-inner">
                      {challenger ? (
                         <CartoonAvatar id={challenger} size="w-full h-full" />
                      ) : (
                         <div className="text-slate-600 text-6xl">?</div>
                      )}
                   </div>
                   
                   <div className="flex items-baseline justify-center gap-1 min-h-[3rem]">
                     {challenger ? (
                        <>
                           <span className="text-5xl font-black text-white">{challenger}</span>
                           <span className="text-2xl text-slate-400 font-bold">号</span>
                        </>
                     ) : (
                        <span className="text-3xl font-bold text-slate-500">等待挑战...</span>
                     )}
                   </div>
                </div>
             </div>

             <div className="absolute bottom-6 right-6 w-72 glass-panel rounded-2xl p-6 hidden xl:block border border-slate-700 shadow-2xl z-20">
                <div className="text-sm font-bold text-slate-400 uppercase mb-3 flex items-center gap-2 border-b border-slate-700 pb-2">
                   <Icons.Trophy className="w-4 h-4 text-yellow-500" /> 本局连胜榜
                </div>
                <div className="space-y-2">
                   {streakRecords.length === 0 && <div className="text-xs text-slate-600 text-center py-2">暂无纪录</div>}
                   {streakRecords.map((rec, i) => (
                      <div key={i} className="flex justify-between items-center text-sm">
                         <div className="flex items-center gap-2">
                            <span className={`text-xs w-4 ${i===0?'text-yellow-400':'text-slate-500'}`}>{i+1}</span>
                            <span className="font-bold text-slate-200">{rec.id}号</span>
                         </div>
                         <span className="text-orange-400 font-mono font-bold">{rec.streak}胜</span>
                      </div>
                   ))}
                </div>
             </div>
             
             <div className="absolute top-0 left-0 w-full h-full -z-10 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
          </div>
       );
    };

    // ==========================================
    // 9. 组件：淘汰赛抽签图
    // ==========================================
    const TournamentBracket = ({ students, onBack, onMatchEnd }) => {
      const [studentPool, setStudentPool] = useState([...students]); 
      const [rounds, setRounds] = useState([]);
      const [activeMatch, setActiveMatch] = useState(null);
      const [introMatch, setIntroMatch] = useState(null);
      const [champion, setChampion] = useState(null);
      const [isDrawing, setIsDrawing] = useState(false); 
      const [hasStarted, setHasStarted] = useState(false); 
      const [drawState, setDrawState] = useState(Array(4).fill({ p1Status: 'waiting', p2Status: 'waiting' }));
      const [svgPaths, setSvgPaths] = useState([]);
      const containerRef = useRef(null);

      const initBracket = () => {
        const initialRounds = [
          [{ p1: null, p2: null, winner: null }, { p1: null, p2: null, winner: null }, { p1: null, p2: null, winner: null }, { p1: null, p2: null, winner: null }], 
          [{p1:null,p2:null}, {p1:null,p2:null}], 
          [{p1:null,p2:null}]
        ];
        setRounds(initialRounds);
        setChampion(null);
        setHasStarted(false);
        setDrawState(Array(4).fill({ p1Status: 'waiting', p2Status: 'waiting' }));
      };

      useEffect(() => {
        initBracket();
      }, []);

      const startDraw = async () => {
        if (studentPool.length < 2) {
           alert("剩余学生不足以进行比赛！请重置或返回。");
           return;
        }

        setHasStarted(true);
        setIsDrawing(true);

        const shuffled = shuffleArray([...studentPool]);
        const currentBatch = shuffled.slice(0, 8);
        
        const selectedSet = new Set(currentBatch);
        const remaining = studentPool.filter(id => !selectedSet.has(id));
        
        setStudentPool(remaining); 

        while(currentBatch.length < 8) currentBatch.push('Bot');
        
        const updateDrawState = (matchIdx, player, status) => {
          setDrawState(prev => { const next = [...prev]; next[matchIdx] = { ...next[matchIdx], [`${player}Status`]: status }; return next; });
        };
        const setPlayerValue = (matchIdx, player, value) => {
           setRounds(prev => { const next = [...prev]; const round0 = [...next[0]]; const match = { ...round0[matchIdx], [player]: value }; round0[matchIdx] = match; next[0] = round0; return next; });
        };

        for (let i = 0; i < 4; i++) {
           updateDrawState(i, 'p1', 'rolling'); await delay(400); 
           updateDrawState(i, 'p1', 'done'); setPlayerValue(i, 'p1', currentBatch[i*2]); await delay(200);
           updateDrawState(i, 'p2', 'rolling'); await delay(400);
           updateDrawState(i, 'p2', 'done'); setPlayerValue(i, 'p2', currentBatch[i*2+1]); await delay(200);
        }
        await delay(200);
        setIsDrawing(false);
      };
      
      const handleNextBatch = () => {
         initBracket();
      };

      useEffect(() => {
        if (!containerRef.current) return; 

        const calculatePaths = () => {
          const newPaths = [];
          const container = containerRef.current;
          
          const connections = [
            { src: [0, 0], dest: [1, 0] }, { src: [0, 1], dest: [1, 0] },
            { src: [0, 2], dest: [1, 1] }, { src: [0, 3], dest: [1, 1] },
            { src: [1, 0], dest: [2, 0] }, { src: [1, 1], dest: [2, 0] }
          ];

          connections.forEach(({src, dest}) => {
            const srcEl = document.getElementById(`match-${src[0]}-${src[1]}`);
            const destEl = document.getElementById(`match-${dest[0]}-${dest[1]}`);

            if (srcEl && destEl) {
              const containerRect = container.getBoundingClientRect();
              const srcRect = srcEl.getBoundingClientRect();
              const destRect = destEl.getBoundingClientRect();

              const startX = srcRect.right - containerRect.left;
              const startY = srcRect.top + srcRect.height / 2 - containerRect.top;

              const isTopSlot = src[1] % 2 === 0;
              const endX = destRect.left - containerRect.left;
              const endY = destRect.top + (isTopSlot ? destRect.height * 0.25 : destRect.height * 0.75) - containerRect.top;

              const midX = (startX + endX) / 2;
              newPaths.push(`M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`);
            }
          });
          setSvgPaths(newPaths);
        };

        const timer = setTimeout(calculatePaths, 100);
        window.addEventListener('resize', calculatePaths);
        return () => { clearTimeout(timer); window.removeEventListener('resize', calculatePaths); };
      }, [rounds, hasStarted]); 

      const handleMatchStart = (rIdx, mIdx) => {
        if (isDrawing) return; 
        const match = rounds[rIdx][mIdx];
        if (match.p1 && match.p2 && !match.winner) {
          setIntroMatch({ rIdx, mIdx, ...match });
        }
      };

      const handleIntroFinished = () => {
        if (introMatch) {
           setActiveMatch(introMatch);
           setIntroMatch(null);
        }
      };

      const handleMatchWinner = (winner) => {
        const { rIdx, mIdx } = activeMatch;
        const newRounds = [...rounds];
        newRounds[rIdx] = [...newRounds[rIdx]];
        newRounds[rIdx][mIdx] = { ...newRounds[rIdx][mIdx], winner };

        if (rIdx < 2) {
          const nextR = rIdx + 1;
          const nextM = Math.floor(mIdx / 2);
          const pos = mIdx % 2 === 0 ? 'p1' : 'p2';
          if (!newRounds[nextR]) newRounds[nextR] = [];
          newRounds[nextR] = [...newRounds[nextR]];
          newRounds[nextR][nextM] = { ...newRounds[nextR][nextM], [pos]: winner };
        } else {
          setChampion(winner);
        }
        setRounds(newRounds);
        setActiveMatch(null);
      };
      
      if (introMatch) {
         return <MatchIntro p1={introMatch.p1} p2={introMatch.p2} onStart={handleIntroFinished} />;
      }

      if (activeMatch) return <BattleArena p1={activeMatch.p1} p2={activeMatch.p2} onWinner={handleMatchWinner} onMatchEnd={onMatchEnd} mode="tournament" onBack={() => setActiveMatch(null)} />;

      if (champion) {
        return (
          <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-yellow-600/20 via-slate-900 to-black animate-pulse"></div>
            
            <div className="absolute inset-0 flex items-center justify-center">
               <div className="w-[800px] h-[800px] bg-yellow-500/10 rounded-full blur-3xl animate-[pulse-ring_3s_infinite]"></div>
            </div>

            <div className="relative z-10 text-center p-12 glass-panel rounded-3xl border-2 border-yellow-400 shadow-[0_0_100px_rgba(234,179,8,0.3)] max-w-2xl w-full mx-4">
               <div className="animate-[pop-in_0.5s_cubic-bezier(0.175,0.885,0.32,1.275)] mb-8">
                  <Icons.Trophy className="w-32 h-32 mx-auto text-yellow-400 drop-shadow-[0_0_20px_rgba(234,179,8,0.8)]" />
               </div>
               
               <div className="text-3xl text-yellow-200 uppercase tracking-[0.5em] mb-6 font-bold animate-[slide-in-up_0.7s_ease-out]">Champion</div>
               
               <div className="text-[10rem] leading-none font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 via-yellow-300 to-yellow-600 mb-10 animate-[slam_0.5s_cubic-bezier(0.175,0.885,0.32,1.275)_0.2s_backwards] drop-shadow-2xl">
                 {champion}
               </div>
               
               <div className="flex flex-col md:flex-row gap-4 justify-center animate-[fade-in_1s_ease-out_0.8s_backwards]">
                 <button onClick={onBack} className="px-8 py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold border border-slate-600 transition-all">
                   返回主菜单
                 </button>
                 {studentPool.length >= 2 && (
                    <button onClick={handleNextBatch} className="px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl font-bold shadow-xl shadow-indigo-900/40 flex items-center justify-center gap-2 transform hover:scale-105 transition-all">
                       <Icons.RotateCcw className="w-6 h-6"/> 
                       <span>继续下一轮抽签</span>
                       <span className="bg-white/20 px-2 py-0.5 rounded text-sm ml-1">{studentPool.length}人待定</span>
                    </button>
                 )}
               </div>
            </div>
            
            <div className="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
               {[...Array(20)].map((_, i) => (
                  <div key={i} className="absolute w-2 h-4 bg-yellow-500 rounded" style={{
                     left: `${Math.random() * 100}%`,
                     top: `-10%`,
                     animation: `float ${3 + Math.random() * 2}s linear infinite`,
                     animationDelay: `${Math.random() * 2}s`,
                     backgroundColor: ['#fcd34d', '#f87171', '#60a5fa', '#a78bfa'][Math.floor(Math.random() * 4)]
                  }}></div>
               ))}
            </div>
          </div>
        );
      }

      return (
        <div className="h-screen flex flex-col bg-slate-950 p-4 overflow-hidden relative">
          <div className="flex justify-between items-center mb-2 z-20 relative shrink-0">
            <button onClick={onBack} className="flex items-center gap-2 text-slate-400 hover:text-white px-3 py-1 rounded-lg border border-transparent hover:border-slate-700 hover:bg-slate-800 transition-all"><Icons.RotateCcw className="w-5 h-5" /> 退出淘汰赛</button>
            <h2 className="text-2xl font-bold text-yellow-500 flex items-center gap-2"><Icons.Dice className={`w-6 h-6 ${isDrawing ? 'animate-spin' : ''}`}/> {isDrawing ? "抽签进行中..." : "8强淘汰赛对阵"}</h2>
          </div>
          
          <div className="flex-1 flex justify-center items-center overflow-auto relative">
             <div className="relative flex gap-24 p-10 min-w-max" ref={containerRef}>
               {!hasStarted && (
                 <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm rounded-3xl">
                   <button 
                     onClick={startDraw}
                     className="px-10 py-5 bg-gradient-to-r from-yellow-500 to-amber-600 text-white text-3xl font-black rounded-full shadow-[0_0_50px_rgba(234,179,8,0.5)] hover:scale-105 active:scale-95 transition-all animate-bounce"
                   >
                     {studentPool.length < 8 ? `抽取最后 ${studentPool.length} 人` : "开始一键抽签"}
                   </button>
                 </div>
               )}

               <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{zIndex: 0}}>
                 {svgPaths.map((d, i) => (
                   <path key={i} d={d} stroke="#475569" strokeWidth="2" fill="none" className="transition-all duration-500" />
                 ))}
               </svg>

               {rounds.map((round, rIdx) => (
                <div key={rIdx} className="flex flex-col justify-around gap-8 z-10 relative">
                  {round.map((match, mIdx) => {
                    let p1Rolling = false, p2Rolling = false;
                    if (rIdx === 0 && isDrawing) { p1Rolling = drawState[mIdx]?.p1Status === 'rolling'; p2Rolling = drawState[mIdx]?.p2Status === 'rolling'; }
                    const isClickable = match.p1 && match.p2 && !match.winner && !isDrawing && hasStarted;
                    
                    return (
                    <div 
                      key={mIdx} 
                      id={`match-${rIdx}-${mIdx}`} 
                      onClick={() => handleMatchStart(rIdx, mIdx)} 
                      className={`w-52 p-4 rounded-xl border-2 transition-all relative bg-slate-900 flex flex-col gap-3
                        ${match.winner ? 'border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.3)]' : (isClickable ? 'border-yellow-500 hover:scale-105 hover:bg-slate-800 cursor-pointer shadow-[0_0_15px_rgba(234,179,8,0.3)]' : 'border-slate-700 opacity-80')}
                      `}
                    >
                      {rIdx === 0 && <div className="absolute -left-6 top-1/2 -translate-y-1/2 text-xs text-slate-600 font-mono rotate-90 w-4">R1</div>}
                      
                      <div className="flex items-center gap-3">
                         <div className={`transition-all duration-500 ${match.p1 ? 'scale-100 opacity-100' : (p1Rolling ? 'scale-90 opacity-80 animate-pulse' : 'scale-0 opacity-0')}`}>
                            <CartoonAvatar id={match.p1 || "mystery"} size="w-10 h-10" />
                         </div>
                         <div className={`flex-1 font-mono font-bold text-xl ${match.winner === match.p1 ? 'text-green-400' : 'text-slate-300'}`}>
                            <SlotMachineNumber value={match.p1} isRolling={p1Rolling} />
                         </div>
                         {match.winner === match.p1 && <Icons.Zap className="w-5 h-5 text-yellow-400 fill-yellow-400 animate-bounce" />}
                      </div>

                      <div className="h-px bg-slate-600/50"></div>

                      <div className="flex items-center gap-3">
                         <div className={`transition-all duration-500 ${match.p2 ? 'scale-100 opacity-100' : (p2Rolling ? 'scale-90 opacity-80 animate-pulse' : 'scale-0 opacity-0')}`}>
                            <CartoonAvatar id={match.p2 || "mystery"} size="w-10 h-10" />
                         </div>
                         <div className={`flex-1 font-mono font-bold text-xl ${match.winner === match.p2 ? 'text-green-400' : 'text-slate-300'}`}>
                            <SlotMachineNumber value={match.p2} isRolling={p2Rolling} />
                         </div>
                         {match.winner === match.p2 && <Icons.Zap className="w-5 h-5 text-yellow-400 fill-yellow-400 animate-bounce" />}
                      </div>

                      {isClickable && <div className="absolute -top-2 -right-2 w-4 h-4 bg-yellow-500 rounded-full animate-ping"></div>}
                    </div>
                  )})}
                </div>
              ))}
            </div>
          </div>
          
          <div className="mt-2 h-24 bg-slate-900/80 border-t border-slate-700 backdrop-blur rounded-t-xl shrink-0 flex flex-col">
             <div className="px-4 py-2 flex justify-between items-center border-b border-slate-800">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                   <Icons.Users className="w-4 h-4" /> 剩余选手池 ({studentPool.length})
                </span>
             </div>
             <div className="flex-1 overflow-x-auto overflow-y-hidden p-3 flex gap-2 items-center">
                {studentPool.sort((a,b) => parseInt(a) - parseInt(b)).map(id => (
                   <div key={id} className="pool-grid-item w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-mono text-slate-400 shrink-0">
                      {id}
                   </div>
                ))}
                {studentPool.length === 0 && <span className="text-slate-600 text-sm ml-4 italic">全员已出战</span>}
             </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 10. 主程序 App
    // ==========================================
    const App = () => {
      const [currentView, setCurrentView] = useState('setup'); 
      const [classNum, setClassNum] = useState(1);
      const [students, setStudents] = useState([]);
      const [selectedMatch, setSelectedMatch] = useState({ p1: null, p2: null });
      
      const [stats1, setStats1] = useState(() => {
        try { return JSON.parse(localStorage.getItem('drone_stats_c1') || '{}'); } catch(e) { return {}; }
      });
      const [stats2, setStats2] = useState(() => {
        try { return JSON.parse(localStorage.getItem('drone_stats_c2') || '{}'); } catch(e) { return {}; }
      });

      useEffect(() => { localStorage.setItem('drone_stats_c1', JSON.stringify(stats1)); }, [stats1]);
      useEffect(() => { localStorage.setItem('drone_stats_c2', JSON.stringify(stats2)); }, [stats2]);

      const updateStats = (winnerId) => {
        if (classNum === 1) {
           setStats1(prev => ({ ...prev, [winnerId]: (prev[winnerId] || 0) + 1 }));
        } else {
           setStats2(prev => ({ ...prev, [winnerId]: (prev[winnerId] || 0) + 1 }));
        }
      };

      const handleStart = (mode, studentList) => {
         setStudents(studentList);
         setCurrentView(mode);
      };

      const handle1v1Confirm = (p1, p2) => {
         setSelectedMatch({ p1, p2 });
         setCurrentView('battle');
      };

      return (
        <div className="antialiased text-slate-200">
           {currentView === 'setup' && (
             <SetupView 
               onStart={handleStart} 
               onLeaderboard={() => setCurrentView('leaderboard')}
               classNum={classNum}
               setClassNum={setClassNum}
             />
           )}

           {currentView === 'select-players' && (
             <PlayerSelection 
               students={students}
               onBack={() => setCurrentView('setup')}
               onConfirm={handle1v1Confirm}
             />
           )}

           {currentView === 'battle' && (
             <BattleArena 
               p1={selectedMatch.p1}
               p2={selectedMatch.p2}
               mode="1v1"
               onWinner={updateStats}
               onBack={() => setCurrentView('select-players')}
             />
           )}

           {currentView === 'king-mode' && (
             <KingGame 
               students={students}
               onMatchEnd={updateStats}
               onBack={() => setCurrentView('setup')}
             />
           )}

           {currentView === 'tournament' && (
             <TournamentBracket 
               students={students}
               onMatchEnd={updateStats}
               onBack={() => setCurrentView('setup')}
             />
           )}

           {currentView === 'leaderboard' && (
             <Leaderboard 
               stats={classNum === 1 ? stats1 : stats2}
               currentClass={classNum}
               onClassChange={setClassNum}
               onBack={() => setCurrentView('setup')}
               onClearStats={() => classNum === 1 ? setStats1({}) : setStats2({})}
             />
           )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
